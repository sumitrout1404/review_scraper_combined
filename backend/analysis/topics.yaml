# Topic catalogue + curated lexicon for the rules classifier.
#
# The 12 keys are FIXED by docs/CONTRACT.md (frontend relies on them).
# label / description / sort_order are upserted into the `topics` table.
#
# Term syntax (all matching is case-insensitive, on whole words):
#   "shared bathroom"  spaces also match hyphens / no space ("check in" ~ "check-in" ~ "checkin")
#   "clean*"           trailing * = any word ending ("clean*" ~ cleaner, cleaning)
#   plain terms automatically accept a plural "s"/"es" on the last word
#   "re:<regex>"       raw regular expression (used sparingly)
#
# Term classes per topic:
#   aspect   - names the topic but carries no opinion ("staff", "shower").
#              Polarity comes from the field (liked = praise, disliked = complaint),
#              overridden by clear opinion words in the same clause / negation.
#   positive - opinion that is praise for this topic ("spotless", "quiet").
#   negative - opinion that is a complaint for this topic ("filthy", "snoring").
# When matches overlap, the longest span wins ("common area" beats "area",
# "hair dryer" beats "hair", "bed bugs" beats "bed").

topics:
  - key: cleanliness
    label: Cleanliness
    description: Cleanliness and hygiene of rooms, pods, bathrooms and common areas - dirt, dust, hair, stains, smells and pests.
    sort_order: 1
    aspect: [cleanliness, cleaning, housekeeping, cleaner, cleaners, hygiene, "cleaning staff", "cleaning lady", tidiness]
    positive: [clean, cleanest, spotless, tidy, immaculate, "well kept", hygienic, "spick and span", "squeaky clean", "super clean", "very clean", "so clean", "really clean", "nice and clean", "clean and tidy", "fresh sheets", "fresh linen", "fresh towels"]
    negative:
      - dirty
      - dirtiest
      - dirt
      - filthy
      - filth
      - dust
      - dusty
      - stain*
      - hair
      - hairs
      - "pubic hair*"
      - mould
      - mold
      - mouldy
      - moldy
      - mildew
      - grime
      - grimy
      - grubby
      - smell*
      - smelly
      - stink*
      - stank
      - musty
      - odour*
      - odor*
      - "bed bug*"
      - bedbug*
      - "bug bite*"
      - bites
      - cockroach*
      - roach*
      - bugs
      - insects
      - ants
      - mice
      - mouse
      - rats
      - unclean
      - unhygienic
      - sticky
      - gross
      - disgusting
      - vomit
      - rubbish
      - "overflowing bin*"
      - garbage
      - trash
      - "not cleaned"
      - "never cleaned"
      - "wasn't cleaned"
      - "weren't cleaned"
      - "could be cleaner"
      - "could have been cleaner"
      - "could've been cleaner"
      - "needs a clean"
      - "needs a good clean"
      - "needs a deep clean"
      - "need a clean"
      - "need cleaning"
      - "needs cleaning"
      - "needed cleaning"
      - "clean more"
      - "cleaned more"
      - "more clean"
      - "cleaned more often"
      - "clean more often"
      - "cleaned regularly"
      - "more regular cleaning"
      - "cleanliness could be improved"
      - "used towels"
